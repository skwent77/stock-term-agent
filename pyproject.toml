[project]
name = "leasemo"
version = "0.1.0"
description = "검색 근거를 함께 보여주는 한국어 주식 용어 AI 교육 서비스"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.4.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
    "llamaindex-chroma-rag",
]
